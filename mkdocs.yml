site_name: Base de Conhecimento TIC IFRN
site_description: Repositório de artigos técnicos e procedimentos para equipes de TIC do IFRN.
site_author: Equipe TIC IFRN
site_url: https://kelsoncm.github.io/base-conhecimento-ifrn/

repo_name: kelsoncm/base-conhecimento-ifrn
repo_url: https://github.com/kelsoncm/base-conhecimento-ifrn
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para tema claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - javascripts/analytics-events.js

extra:
  analytics:
    provider: google
    property: !ENV [GA_MEASUREMENT_ID, ""]
    feedback:
      title: Este artigo foi útil?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Este artigo resolveu meu problema
          data: 1
          note: >-
            Obrigado pelo seu feedback!
        - icon: material/emoticon-sad-outline
          name: Este artigo precisa de melhorias
          data: 0
          note: >-
            Obrigado pelo retorno. Sugestões podem ser enviadas abrindo uma issue no repositório.
  consent:
    title: Consentimento de Cookies
    description: >-
      Utilizamos cookies e métricas anônimas de acesso para aprimorar a base de conhecimento de TIC do IFRN, em conformidade com a LGPD.
    actions:
      - accept
      - reject

nav:
  - Início:
      - Apresentação: index.md
      - Como Contribuir: contribuindo.md
      - Política de Segurança: seguranca.md
  - Redes:
      - Solução de problemas Wi-Fi: redes/solucao-problemas-wifi-eduroam.md
      - Autorização na rede IoT: redes/autorizacao-dispositivos-wifrn-iot.md
      - Reserva de IP fixo via DHCP: redes/reserva-ip-dhcp.md
      - Infovia Potiguar e RNP: redes/infovia-potiguar-rnp.md
      - Linux e Wi-Fi Corporativo: redes/linux-wifi-corporativo.md
      - Eventos e Wi-Fi para Visitantes: redes/eventos-wifi-visitantes.md
  - SUAP:
      - Diagnóstico de lentidão no SUAP: suap/lentidao-modulo-rsc.md
      - Configuração de E-mail Institucional: suap/configuracao-email-institucional.md
      - Integração com a API do SUAP: suap/integracao-api-suap.md
      - PGD e RSC (Preenchimento de Tempo): suap/pgd-rsc-preenchimento-tempo.md
  - Infraestrutura:
      - Migração VMware para Proxmox: infraestrutura/migracao-vmware-proxmox.md
      - Monitoramento LibreNMS e Zabbix: infraestrutura/monitoramento-librenms-zabbix.md
  - Sistemas:
      - Windows Update e WSUS (RSAT): sistemas/windows-update-wsus-rsat.md
      - Limites de Envio no Webmail: sistemas/limites-envio-email-webmail.md
      - Sistema de Ponto (Cadastro Digital): sistemas/sistema-ponto-cadastro-digital.md
  - Procedimentos:
      - Liberação de Usuários Externos: procedimentos/liberacao-usuarios-externos.md
      - Abertura de Chamados no SUAP: procedimentos/abertura-chamados-suap.md
  - Contratos:
      - Outsourcing de Impressão: contratos/outsourcing-impressao-demanda.md
  - Acesso Remoto:
      - Solicitação via Guacamole: acesso-remoto/guacamole-solicitacao.md
  - Licenças:
      - Office 365 e Microsoft 365: licencas/office365-microsoft365-licencas.md
