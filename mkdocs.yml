site_name: Conhecimentos Pessoais
site_description: Anotações técnicas, procedimentos e compartilhamento de conhecimentos pessoais de Kelson da Costa Medeiros.
site_author: Kelson da Costa Medeiros
site_url: https://kelsoncm.github.io/conhecimentos-pessoais/

repo_name: kelsoncm/conhecimentos-pessoais
repo_url: https://github.com/kelsoncm/conhecimentos-pessoais
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para tema claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - javascripts/analytics-events.js

extra:
  analytics:
    provider: google
    property: !ENV [GA_MEASUREMENT_ID, ""]
    feedback:
      title: Este artigo foi útil?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Este artigo resolveu meu problema
          data: 1
          note: >-
            Obrigado pelo seu feedback!
        - icon: material/emoticon-sad-outline
          name: Este artigo precisa de melhorias
          data: 0
          note: >-
            Obrigado pelo retorno. Sugestões podem ser enviadas abrindo uma issue no repositório.
  consent:
    title: Consentimento de Cookies
    description: >-
      Utilizamos cookies e métricas anônimas de acesso para aprimorar este repositório de conhecimentos pessoais, em conformidade com a LGPD.
    actions:
      - accept
      - reject

nav:
  - Início: index.md
  - IFRN:
      - Apresentação: ifrn/index.md
      - Redes:
          - Solução de problemas Wi-Fi: ifrn/redes/solucao-problemas-wifi-eduroam.md
          - Autorização na rede IoT: ifrn/redes/autorizacao-dispositivos-wifrn-iot.md
          - Reserva de IP fixo via DHCP: ifrn/redes/reserva-ip-dhcp.md
          - Infovia Potiguar e RNP: ifrn/redes/infovia-potiguar-rnp.md
          - Linux e Wi-Fi Corporativo: ifrn/redes/linux-wifi-corporativo.md
          - Eventos e Wi-Fi para Visitantes: ifrn/redes/eventos-wifi-visitantes.md
      - SUAP:
          - Diagnóstico de lentidão no SUAP: ifrn/suap/lentidao-modulo-rsc.md
          - Configuração de E-mail Institucional: ifrn/suap/configuracao-email-institucional.md
          - Integração com a API do SUAP: ifrn/suap/integracao-api-suap.md
          - PGD e RSC (Preenchimento de Tempo): ifrn/suap/pgd-rsc-preenchimento-tempo.md
      - Infraestrutura:
          - Migração VMware para Proxmox: ifrn/infraestrutura/migracao-vmware-proxmox.md
          - Monitoramento LibreNMS e Zabbix: ifrn/infraestrutura/monitoramento-librenms-zabbix.md
      - Sistemas:
          - Windows Update e WSUS (RSAT): ifrn/sistemas/windows-update-wsus-rsat.md
          - Limites de Envio no Webmail: ifrn/sistemas/limites-envio-email-webmail.md
          - Sistema de Ponto (Cadastro Digital): ifrn/sistemas/sistema-ponto-cadastro-digital.md
      - Procedimentos:
          - Liberação de Usuários Externos: ifrn/procedimentos/liberacao-usuarios-externos.md
          - Abertura de Chamados no SUAP: ifrn/procedimentos/abertura-chamados-suap.md
      - Contratos:
          - Outsourcing de Impressão: ifrn/contratos/outsourcing-impressao-demanda.md
      - Acesso Remoto:
          - Solicitação via Guacamole: ifrn/acesso-remoto/guacamole-solicitacao.md
      - Licenças:
          - Office 365 e Microsoft 365: ifrn/licencas/office365-microsoft365-licencas.md
  - Sobre:
      - Como Contribuir: contribuindo.md
      - Política de Segurança: seguranca.md
